  html,body{margin:0;padding:0}
  body{font-family:"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro",-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:radial-gradient(1100px 750px at 50% 28%,#f4f4f0,#dbdbd4);color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;min-height:100dvh}
  #device{position:relative;width:min(600px,97vw,72dvh);aspect-ratio:3/4;height:min(800px,129.3333vw,96dvh);background:#17171a;border-radius:48px;padding:30px;box-shadow:0 40px 90px rgba(15,15,20,.45),0 4px 18px rgba(15,15,20,.35),inset 0 0 0 2px #2e2e33;flex:none}
  #device::before{content:"";position:absolute;top:12px;left:50%;transform:translateX(-50%);width:9px;height:9px;border-radius:50%;background:#3d3d44;box-shadow:inset 0 0 3px #000,0 0 0 2px #101013;z-index:2}
  .sidebtn{position:absolute;background:#2e2e33;border-radius:3px;z-index:1}
  .sidebtn.s1{right:-3.5px;top:140px;width:4px;height:72px}
  .sidebtn.s2{left:-3.5px;top:120px;width:4px;height:50px}
  .sidebtn.s3{left:-3.5px;top:182px;width:4px;height:50px}
  #phone{position:relative;width:100%;height:100%;background:var(--bg);border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
  #phone::-webkit-scrollbar{display:none}
  #homebar{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:150px;height:5px;border-radius:99px;background:rgba(20,20,20,.32);z-index:60;pointer-events:none}
  @media (max-width:640px){ #device{padding:16px;border-radius:34px} #device::before{top:6px;width:7px;height:7px} #phone{border-radius:18px} }
  header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px}
  header .back{border:0;background:var(--field);color:var(--ink);font-size:20px;width:36px;height:36px;border-radius:50%;cursor:pointer;flex:none;line-height:1}
  header .back:disabled{opacity:.25}
  header .back:active{background:#e4e4de}
  header h1{font-size:16px;font-weight:700;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
  header .hdrLogo{height:30px;width:auto;flex:none}
  header .role{font-size:11px;font-weight:600;background:var(--field);color:var(--sub);padding:5px 10px;border-radius:999px;flex:none}
  main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:18px 16px 24px;scrollbar-width:none}
  main::-webkit-scrollbar{display:none}
  @keyframes screenIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  main.anim{animation:screenIn .22s ease both}
  .pagehead{font-size:19px;font-weight:800;margin:6px 2px 14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:12px;box-shadow:var(--shadow)}
  .card h2{font-size:15px;font-weight:700;margin:0 0 8px;letter-spacing:.01em}
  .muted{color:var(--sub);font-size:12.5px;line-height:1.55}
  .btn{display:block;width:100%;border:0;border-radius:999px;padding:15px;font-size:15px;font-weight:700;cursor:pointer;background:var(--ink);color:#fff;margin:8px 0;transition:transform .06s ease,opacity .15s}
  .btn:active{transform:scale(.985);opacity:.88}
  .btn.sub{background:var(--field);color:var(--ink)}
  .btn.blue{background:var(--blue)} .btn.warn{background:var(--warn)} .btn.bad{background:var(--bad)}
  .btn:disabled{opacity:.4}
  .item{display:flex;align-items:center;gap:10px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px 16px;margin-bottom:10px;cursor:pointer;width:100%;text-align:left;font-size:14.5px;box-shadow:var(--shadow);transition:transform .06s ease}
  .item:active{transform:scale(.99)}
  .item .grow{flex:1;line-height:1.45}
  .item .chev{flex:none;width:27px;height:27px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}
  .tag{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:#1e7a32;margin:3px 4px 0 0}
  .tag.orange{background:#fdf1de;color:#9a6206}.tag.red{background:#fdeceb;color:#b42318}.tag.blue{background:#e5effc;color:#175cd3}
  input,select,textarea{width:100%;font-size:15px;padding:13px 14px;border:1.5px solid transparent;border-radius:14px;margin:6px 0 12px;background:var(--field);font-family:inherit;color:var(--ink);outline:none}
  input:focus,select:focus,textarea:focus{background:#fff;border-color:var(--ink)}
  label{font-size:13px;font-weight:700}
  .choices button{display:block;width:100%;text-align:left;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px 15px;margin:8px 0;font-size:15px;cursor:pointer;transition:border-color .12s,background .12s}
  .choices button.sel{border-color:var(--ink);background:#f4f4f1;font-weight:700}
  .bar{height:8px;background:#eeeEe8;background:#eeeee8;border-radius:999px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
  .rowline{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;margin:7px 0}
  nav.tabs{flex:none;width:100%;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:none;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
  nav.tabs.show{display:flex}
  nav.tabs button{flex:1;border:0;background:none;padding:7px 2px 10px;font-size:10.5px;color:var(--faint);cursor:pointer;font-weight:600}
  nav.tabs button.on{color:var(--ink)}
  nav.tabs button .ic{display:block;font-size:21px;margin-bottom:1px;filter:grayscale(1);opacity:.55}
  nav.tabs button.on .ic{filter:none;opacity:1}
  .modal{position:absolute;inset:0;background:rgba(25,25,20,.44);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .modal.show{display:flex}
  .modal .sheet{background:#fff;width:100%;max-width:100%;border-radius:26px 26px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom));max-height:84dvh;overflow:auto;animation:sheetIn .24s cubic-bezier(.2,.9,.3,1) both}
  @keyframes sheetIn{from{transform:translateY(36px);opacity:.4}to{transform:none;opacity:1}}
  .modal .sheet h3{margin:2px 0 10px;font-size:16px}
  .done-ic{font-size:34px;width:76px;height:76px;margin:22px auto 10px;background:var(--accent-soft);border-radius:50%;display:flex;align-items:center;justify-content:center}
  .center{text-align:center}
  .qr{width:172px;height:172px;margin:12px auto;background:conic-gradient(#222 25%,#fff 0 50%,#222 0 75%,#fff 0) 0 0/34px 34px,#fff;border:10px solid #fff;outline:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
    .linklike{display:block;margin:20px auto 2px;background:none;border:none;color:#8e8e93;font-size:13px;text-decoration:underline;cursor:pointer;padding:4px 8px}
.camwrap{position:relative;width:248px;height:248px;margin:12px auto;border-radius:16px;overflow:hidden;background:#1c1c1e;box-shadow:var(--shadow)}
  .camwrap video{width:100%;height:100%;object-fit:cover;display:block}
  .camframe{position:absolute;inset:34px;border:3px solid rgba(255,255,255,.9);border-radius:14px;pointer-events:none;box-shadow:0 0 0 999px rgba(0,0,0,.18)}

  .hero{position:relative;padding:30px 0 6px}
  .terms{height:150px;overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.65;background:var(--field);text-align:left;margin:8px 0}
  .terms p{margin:0 0 8px}
  .welcomeWrap{display:flex;flex-direction:column;min-height:100%}
  .welcomeHero{flex:1;display:flex;flex-direction:column;justify-content:center}
  .blob{position:absolute;border-radius:50%;filter:blur(30px);opacity:.5;pointer-events:none}
  .b1{width:160px;height:160px;background:#ffb35c;top:-6px;left:-36px}
  .b2{width:140px;height:140px;background:#8fd0cc;top:44px;right:-30px}
  .b3{width:100px;height:100px;background:#c3b2ec;bottom:-16px;left:38%}
  .roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .role{display:flex;flex-direction:column;align-items:flex-start;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:16px 14px;text-align:left;cursor:pointer;transition:transform .12s}
  .role:active{transform:scale(.97)}
  .role .ic{font-size:27px;line-height:1}
  .role b{font-size:15.5px}
  .role span{font-size:11.5px;color:var(--sub)}
  .logoImg{display:block;position:relative;width:min(250px,74%);height:auto;margin:0 auto;filter:drop-shadow(0 12px 22px rgba(70,55,20,.13))}
  .logo{width:88px;height:88px;margin:34px auto 6px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:42px;background:linear-gradient(#fff,#fff) padding-box,conic-gradient(from 210deg,#0082fb,#a033ff,#ff5280,#ffca7a,#37c978,#0082fb) border-box;border:3.5px solid transparent;box-shadow:0 10px 26px rgba(80,60,180,.16)}
  .switchrow{display:flex;align-items:center;justify-content:space-between;padding:9px 0}
  .seg{display:flex;gap:8px}.seg button{flex:1;padding:11px;border-radius:999px;border:1.5px solid var(--line);color:var(--ink);background:#fff;font-size:14px;cursor:pointer;font-weight:600}
  .seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .greet{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:14px 16px;margin:0 0 12px}
  .greet .ava{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#ffe29a,#ffb35c);display:flex;align-items:center;justify-content:center;font-size:25px;flex:none;box-shadow:var(--shadow)}
  .greet h2{margin:0;font-size:19px}
  .stats{display:flex;gap:8px;margin-bottom:12px}
  .stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:11px 4px;text-align:center}
  .stat b{display:block;font-size:16px;margin-bottom:2px}
  .stat span{font-size:11px;color:var(--sub)}
  .note{background:#fffaf0;border:1px solid #f2e3b8;border-radius:16px;padding:12px 14px;font-size:12.5px;line-height:1.55;margin-bottom:12px;color:#6d5510}
  .memoWrap{overflow:auto;height:340px;border:1.5px solid var(--line);border-radius:14px;background:#fff;margin:6px 0 4px}
  #memoCanvas{display:block;touch-action:none;background:#fff}
  .memoTools{margin:4px 0 2px}
  .trow{display:flex;align-items:center;gap:6px;margin:7px 0;flex-wrap:wrap}
  .tlabel{font-size:12px;font-weight:700;color:var(--sub);width:36px;flex:none}
  .sw{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0;flex:none}
  .sw.sel{box-shadow:0 0 0 2.5px var(--ink)}
  .tbtn{border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer;font-weight:600}
  .tbtn.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
  #memoColorPick{width:38px;height:30px;padding:2px;margin:0;background:#fff;border:1.5px solid var(--line);border-radius:9px;cursor:pointer;flex:none}
  .btn.mini{width:auto;display:inline-block;padding:9px 16px;font-size:13px;margin:0}
  .memoimg{width:100%;border:1.5px solid var(--line);border-radius:14px;background:#fff;display:block;margin:6px 0 10px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  td,th{border-bottom:1px solid var(--line);padding:9px 4px;text-align:left}
  tr:last-child td{border-bottom:0}
  .chart{display:flex;align-items:flex-end;gap:5px;height:104px;margin-top:10px}
  .chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}
  .chart .v{font-size:10.5px;color:var(--sub)}
  .chart .b{width:68%;background:#bcd6f7;border-radius:4px 4px 0 0}
  .chart .b.today{background:var(--blue)}
  .chart .d{font-size:10.5px;color:var(--sub)}
  .chart .d.today{color:var(--blue);font-weight:700}
</style>
</head>

<script>
"use strict";
/* ============ 画面遷移の仕組み（DBなし・遷移だけ） ============ */
function addStu(){ openModal('<h3>所属生徒追加の確認</h3><p class="muted">この生徒を 5年2組 に追加しますか？</p><button class="btn" onclick="closeModal();go(\'t_classdetail\')">追加する</button><button class="btn sub" onclick="closeModal()">やめる</button>'); }
const MEMO_W = 1200, MEMO_H = 1600;
const memoTool = { color:"#1a1a18", type:"pen", width:3 };
let memoDirty = false;
function memoSyncTools(){
  if(!document.querySelectorAll) return;
  document.querySelectorAll(".sw").forEach(b=>b.classList.toggle("sel", b.dataset.color === memoTool.color && memoTool.type !== "eraser"));
  document.querySelectorAll("[data-type]").forEach(b=>b.classList.toggle("sel", b.dataset.type === memoTool.type));
  document.querySelectorAll("[data-width]").forEach(b=>b.classList.toggle("sel", parseFloat(b.dataset.width) === memoTool.width));
}
function memoSetColor(c){ memoTool.color = c; if(memoTool.type === "eraser" || memoTool.type === "pan") memoTool.type = "pen"; memoSyncTools(); }
function memoSetType(tp){ memoTool.type = tp; memoSyncTools(); }
function memoSetWidth(w){ memoTool.width = w; memoSyncTools(); }
function memoSaveCurrent(){
  const cv = document.getElementById("memoCanvas");
  if(cv && memoDirty){ try{ S.memoPages[S.memoPage] = cv.toDataURL("image/png"); }catch(_){} }
}
function memoGoPage(i){ memoSaveCurrent(); S.memoPage = i; render(); }
function memoAddPage(){ memoSaveCurrent(); S.memoPages.push(null); S.memoPage = S.memoPages.length - 1; render(); }
function memoDelPage(){ S.memoPages.splice(S.memoPage,1); if(!S.memoPages.length) S.memoPages = [null]; S.memoPage = Math.max(0, S.memoPage - 1); render(); }
function memoClear(){ S.memoPages[S.memoPage] = null; render(); }
function memoSaveImage(){
  memoSaveCurrent();
  const url = S.memoPages[S.memoPage];
  if(!url){ openModal('<h3>まだ何も描かれていません</h3><p class=muted>描いてから保存してください．</p><button class="btn sub" onclick="closeModal()">閉じる</button>'); return; }
  const a = document.createElement("a");
  a.href = url; a.download = "考え方メモ_" + String(S.unit || "単元").replace(/[\\/:*?"<>|]/g, "_") + "_ページ" + (S.memoPage + 1) + ".png";
  document.body.appendChild(a); a.click(); a.remove();
}
function memoPageBar(){
  let h = '<div class="trow"><span class="tlabel">ページ</span>';
  S.memoPages.forEach((_, i)=>{ h += '<button class="tbtn' + (i === S.memoPage ? ' sel' : '') + '" onclick="memoGoPage(' + i + ')">' + (i + 1) + '</button>'; });
  h += '<button class="tbtn" onclick="memoAddPage()">＋ 追加</button>';
  if(S.memoPages.length > 1) h += '<button class="tbtn" onclick="memoDelPage()">このページを削除</button>';
  return h + '</div>';
}
function memoPostImgs(){
  const ps = S.memoPages || [];
  if(!ps.some(Boolean)) return '<p class="muted">手書きメモは添付されていません．問題解答の画面で描いたメモが，ここに付きます．</p>';
  return ps.map((pg, i)=> pg ? '<p class="muted" style="margin:6px 0 2px">手書きメモ（ページ' + (i + 1) + '）</p><img class="memoimg" src="' + pg + '" alt="手書きメモ">' : "").join("");
}
function initMemo(){
  const cv = document.getElementById("memoCanvas");
  if(!cv || !cv.getContext) return;
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(MEMO_W * dpr); cv.height = Math.round(MEMO_H * dpr);
  cv.style.width = MEMO_W + "px"; cv.style.height = MEMO_H + "px";
  const ctx = cv.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, MEMO_W, MEMO_H);
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  memoDirty = false;
  const saved = S.memoPages[S.memoPage];
  if(saved){ const img = new Image(); img.onload = ()=>{ ctx.drawImage(img, 0, 0, MEMO_W, MEMO_H); }; img.src = saved; memoDirty = true; }
  memoSyncTools();
  let drawing = false, last = null, panStart = null;
  const pos = (e)=>{ const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  cv.addEventListener("pointerdown", (e)=>{
    e.preventDefault();
    try{ cv.setPointerCapture(e.pointerId); }catch(_){}
    if(memoTool.type === "pan"){ const w = cv.parentElement; panStart = { x: e.clientX, y: e.clientY, sl: w.scrollLeft, st: w.scrollTop }; return; }
    drawing = true; memoDirty = true; last = pos(e);
    if(memoTool.type === "eraser"){ ctx.strokeStyle = "#ffffff"; ctx.globalAlpha = 1; ctx.lineWidth = memoTool.width * 3; }
    else if(memoTool.type === "marker"){ ctx.strokeStyle = memoTool.color; ctx.globalAlpha = 0.35; ctx.lineWidth = memoTool.width * 2.4; }
    else { ctx.strokeStyle = memoTool.color; ctx.globalAlpha = 1; ctx.lineWidth = memoTool.width; }
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(last.x + 0.1, last.y + 0.1); ctx.stroke();
  });
  cv.addEventListener("pointermove", (e)=>{
    if(panStart){ const w = cv.parentElement; w.scrollLeft = panStart.sl - (e.clientX - panStart.x); w.scrollTop = panStart.st - (e.clientY - panStart.y); return; }
    if(!drawing) return;
    const pt = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(pt.x, pt.y); ctx.stroke(); last = pt;
  });
  const end = ()=>{ if(panStart){ panStart = null; return; } if(!drawing) return; drawing = false; ctx.globalAlpha = 1; memoSaveCurrent(); };
  cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);
}

function chkTermsFn(fn){
  const c = document.getElementById("termsChk");
  if(!c || !c.checked){ openModal(TERMS_NG); return; }
  fn();
}
let camStream = null;
function stopCam(){ if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream = null; } }
async function initCam(){
  const v = document.getElementById("qrVideo");
  if(!v){ stopCam(); return; }
  const msg = document.getElementById("qrMsg");
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    if(msg) msg.textContent = "この環境ではカメラを使えません．「読み取る」を押して進めます．";
    return;
  }
  try{
    stopCam();
    camStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:"environment" }, audio:false });
    const v2 = document.getElementById("qrVideo");
    if(!v2){ stopCam(); return; }
    v2.srcObject = camStream;
    if(msg) msg.textContent = "生徒の端末に表示されたQRコードを，枠に合わせてください．";
  }catch(e){
    if(msg) msg.textContent = "カメラの許可が必要です．許可できない場合は「読み取る」を押して進めます．";
  }
}
function go(id){
  if(!SCREENS[id]){ alert("未実装の画面です: "+id); return; }
  stack.push(id); render();
}
// 遷移図で一方通行の流れ（チェーン）の中の画面．戻るボタンでは戻れない（チェーンの先頭まで飛ぶ）
const FLOW = new Set([
  "s_regdone","s_pconsent","s_regcomp",
  "s_answer","s_ansdone","s_reflect","s_procview","s_procpost","s_postdone",
  "s_quizans","s_quizdone","s_knowview","s_reportchk","s_reportdone",
  "s_reclist","s_edit","s_agenthist","s_qr","s_chgdone","s_inqdone",
  "p_qr","p_confirm","p_regdone","p_progress","p_consentsel","p_addchild","p_unlinkdone",
  "t_unit","t_tmpl","t_search","t_searchres","t_qconfirm","t_provdetail","t_provdone",
  "t_classdetail","t_stusearch","t_classsetdone","t_statusdetail","t_noticedetail",
  "a_members","a_memberdetail","a_stop","a_posts","a_postdetail","a_reportdetail",
  "a_qbank","a_qedit","a_noticeedit"
]);
function back(){
  if(stack.length <= 1) return;
  stack.pop();
  while(stack.length > 1 && FLOW.has(stack[stack.length - 1])) stack.pop();
  render();
}
function fixBack(){                                   // 問題確認の「直す」：流れの中の直前の作業画面へ
  const dest = S.qFrom || "t_tmpl";
  stack.pop();
  if(stack[stack.length - 1] !== dest) stack.push(dest);
  render();
}
function jump(id){ stack = [id]; render(); }           // 履歴をリセットして移動（ログイン等）
function finishTo(id){                              // 完了画面から出る時：完了画面を履歴に残さない
  if(["s_home","p_home","t_home","a_menu","login","welcome","start"].includes(id)){ jump(id); return; }
  stack.pop();
  if(stack[stack.length - 1] !== id) stack.push(id);
  render();
}
function homeOf(role){
  return {student:"s_home", parent:"p_home", teacher:"t_home", admin:"a_menu"}[role] || "start";
}
function render(){
  cur = stack[stack.length-1];
  const sc = SCREENS[cur];
  document.getElementById("hdrTitle").textContent = sc.title;
  document.getElementById("hdrRole").textContent = sc.role || "";
  document.getElementById("backBtn").disabled = stack.length <= 1;
  document.querySelector("header").style.display = (cur === "welcome") ? "none" : "flex";
  if(cur === "welcome") loggedIn = false;
  const app = document.getElementById("app");
  app.innerHTML = typeof sc.html === "function" ? sc.html() : sc.html;
  app.classList.remove("anim"); void app.offsetWidth; app.classList.add("anim");
  initMemo();
  initCam();
  window.scrollTo(0,0); if(app && app.scrollTo) app.scrollTo(0,0);
  // 生徒タブバー
  const tb = document.getElementById("tabbar");
  if(sc.tab){
    tb.className = "tabs show";
    tb.innerHTML = [["s_home","🏠","ホーム"],["s_solve","✏️","解く"],["s_quiz","💬","みんなどう？"],["s_know","💡","知ってる？"],["s_settings","⚙️","設定"]]
      .map(([id,ic,lb])=>`<button class="${sc.tab===id?'on':''}" onclick="jump('${id}')"><span class="ic">${ic}</span>${lb}</button>`).join("");
    document.querySelector("main").style.paddingBottom = "90px";
  } else {
    tb.className = "tabs"; tb.innerHTML = "";
    document.querySelector("main").style.paddingBottom = "20px";
  }
  if(sc.onshow) sc.onshow();
}
function openModal(html){ document.getElementById("modalSheet").innerHTML = html; document.getElementById("modal").classList.add("show"); }
function closeModal(){ document.getElementById("modal").classList.remove("show"); }
function item(go_id, title, sub, tags){
  return `<button class="item" onclick="go('${go_id}')"><span class="grow"><b>${title}</b>${sub?`<br><span class="muted">${sub}</span>`:""}${tags?`<br>${tags}`:""}</span><span class="chev">›</span></button>`;
}
function doneScr(emoji, title, msg, btnLabel, go_id){
  return `<div class="done-ic">${emoji}</div><h2 class="center">${title}</h2><p class="center muted">${msg}</p>
          <button class="btn" onclick="finishTo('${go_id}')">${btnLabel}</button>`;
}

def("login","ログイン","",()=>`
  <div class="card"><h2>${roleName} ログイン</h2>
    <label>メールアドレス</label><input type="email" placeholder="example@mail.jp" value="demo@manabico.jp">
    <label>パスワード</label><input type="password" value="demo1234">
    <button class="btn" onclick="doLogin()">ログイン</button>
    <button class="btn sub" onclick="go('pw')">パスワードを忘れた方</button>
  </div>
  <div class="card"><h2>はじめての方</h2>
    <button class="btn sub" onclick="go(regOf())">新規会員登録はこちら</button>
  </div>
`);
function tapBack(){ if(loggedIn) return; jump('welcome'); }
function regOf(){ return {"生徒":"s_reg","保護者":"p_reg","先生":"t_reg","管理者":"a_menu"}[roleName] || "s_reg"; }
let loggedIn = false;
function doLogin(){
  const dest = {"生徒":"s_home","保護者":"p_home","先生":"t_home","管理者":"a_menu"}[roleName] || "s_home";
  loggedIn = true;
  jump(dest);
}
def("pw","パスワード再設定","",`

    <p class="muted">登録したメールアドレスに，再設定用の案内を送ります．</p>

    <button class="btn sub" onclick="back()">もどる</button>
  </div>
`);

const TMPLS = {
  "分数のたし算":[
    {icon:"🍕", thing:"ピザ", diff:"ふつう", kind:"frac", def:[1,3,1,6], text:v=>`ピザの ${fr(v[0],v[1])} と，ピザの ${fr(v[2],v[3])} を食べました．合わせると，ピザ何個分になりますか．`},
    {icon:"🥤", thing:"ジュース", diff:"ふつう", kind:"frac", def:[3,4,1,8], text:v=>`ジュースが ${fr(v[0],v[1])} L と ${fr(v[2],v[3])} L あります．合わせると何Lになりますか．`},
    {icon:"🎀", thing:"リボン", diff:"やさしい", kind:"frac", def:[2,5,3,10], text:v=>`赤いリボン ${fr(v[0],v[1])} m と，青いリボン ${fr(v[2],v[3])} m をつなげると，何mになりますか．`},
    {icon:"🔢", thing:"計算だけ", diff:"やさしい", kind:"frac", def:[1,3,1,6], text:v=>`${fr(v[0],v[1])} ＋ ${fr(v[2],v[3])} ＝ ？`}
  ],
  "面積の求め方":[
    {icon:"🌷", thing:"花だん", diff:"ふつう", kind:"rect", unit:"㎡", def:[3,5], text:v=>`たて ${v[0]} m，横 ${v[1]} m の長方形の花だんの面積は，何㎡ですか．`},
    {icon:"🖼️", thing:"画用紙", diff:"ふつう", kind:"rect", unit:"㎠", def:[20,30], text:v=>`たて ${v[0]} cm，横 ${v[1]} cm の画用紙の面積は，何㎠ですか．`},
    {icon:"🟦", thing:"タイル", diff:"やさしい", kind:"square", unit:"㎠", def:[6], text:v=>`1辺が ${v[0]} cm の正方形のタイルの面積は，何㎠ですか．`},
    {icon:"🔢", thing:"計算だけ", diff:"やさしい", kind:"rect", unit:"㎠", def:[8,7], text:v=>`たて ${v[0]} cm，横 ${v[1]} cm の長方形の面積は，何㎠ですか．`}
  ]
};
function gcd(a,b){ return b ? gcd(b, a % b) : a; }
function fr(n,d){ return d === 1 ? "" + n : n + "/" + d; }
function fracAns(n1,d1,n2,d2){
  let n = n1 * d2 + n2 * d1, d = d1 * d2;
  const g = gcd(n, d) || 1; n /= g; d /= g;
  if(d === 1) return "" + n;
  if(n > d){ const w = Math.floor(n / d), r = n % d; return r ? w + "と" + r + "/" + d : "" + w; }
  return n + "/" + d;
}
function fmtNum(x){ return "" + (Math.round(x * 100) / 100); }
function tmplQA(t, vals){
  const v = vals || t.def;
  let a;
  if(t.kind === "frac") a = fracAns(v[0], v[1], v[2], v[3]);
  else if(t.kind === "rect") a = fmtNum(v[0] * v[1]) + " " + t.unit;
  else a = fmtNum(v[0] * v[0]) + " " + t.unit;
  return {q: t.text(v), a};
}
function curTmpl(){ const u = S.unit || "分数のたし算"; return TMPLS[u][S.tmplSel || 0]; }
function pickUnit(u){ S.qFrom = "t_tmpl"; S.unit = u; S.tmplSel = 0; S.tmplVals = [...TMPLS[u][0].def]; S.qSel = tmplQA(TMPLS[u][0]); go("t_tmpl"); }
function pickTmpl(i){ S.qFrom = "t_tmpl"; const u = S.unit || "分数のたし算"; S.tmplSel = i; S.tmplVals = [...TMPLS[u][i].def]; S.qSel = tmplQA(TMPLS[u][i]); render(); }
function setVal(i, el){
  let x = parseFloat(el.value);
  if(isNaN(x)) x = 0;
  const t = curTmpl();
  if(t.kind === "frac"){ x = Math.max(0, Math.round(x)); if(i % 2 === 1 && x === 0) x = 1; }
  if(!S.tmplVals) S.tmplVals = [...t.def];
  S.tmplVals[i] = x;
  S.qSel = tmplQA(t, S.tmplVals);
  render();
}

def("t_tmpl","単元テンプレート","先生",()=>{
  const unit = S.unit || "分数のたし算";
  const sel = S.tmplSel || 0;
  const t = TMPLS[unit][sel];
  const vals = S.tmplVals || t.def;
  const cards = TMPLS[unit].map((tt,i)=>{
    const qa = tmplQA(tt, i === sel ? vals : null);
    return `<button class="${i===sel?"sel":""}" onclick="pickTmpl(${i})"><b>${tt.icon} ${tt.thing}</b> <span class="tag">${tt.diff}</span><br><span style="font-size:14px">${qa.q}</span><br><span class="muted">答え：${qa.a}</span></button>`;
  }).join("");
  let editor = "";
  if(t.kind === "frac"){
    const inp = (i)=>`<input type="number" value="${vals[i]}" min="0" step="1" onchange="setVal(${i},this)" style="width:62px;margin:0;text-align:center">`;
    editor = `<div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:17px">${inp(0)}<span>／</span>${inp(1)}<span>＋</span>${inp(2)}<span>／</span>${inp(3)}</div>`;
  } else if(t.kind === "rect"){
    editor = `<label>たて</label><input type="number" value="${vals[0]}" min="0" onchange="setVal(0,this)"><label>横</label><input type="number" value="${vals[1]}" min="0" onchange="setVal(1,this)">`;
  } else {
    editor = `<label>1辺</label><input type="number" value="${vals[0]}" min="0" onchange="setVal(0,this)">`;
  }
  const qa = tmplQA(t, vals);
  return `<h2 class="pagehead">${unit}</h2>
  <div class="choices">${cards}</div>
  <div class="card"><h2>値の変更</h2>
    ${editor}
    <p style="font-size:16px;margin-top:14px">${qa.q}</p>
    <p class="muted">答え：${qa.a}</p>
  </div>
  <button class="btn" onclick="go('t_qconfirm')">確認へ進む</button>`;
});
