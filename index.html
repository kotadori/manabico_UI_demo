<title>まなびこ</title>
<style>
  :root{ color-scheme:light;
    --ink:#1a1a18; --sub:#6f6f6a; --faint:#a3a39c;
    --bg:#f7f7f4; --card:#ffffff; --line:#e7e7e1; --field:#f1f1ed;
    --accent:#2f9e44; --accent-soft:#e9f6ec;
    --blue:#0064d1; --warn:#e8930c; --bad:#d92d20;
    --radius:20px;
    --shadow:0 1px 2px rgba(20,20,15,.05),0 8px 24px rgba(20,20,15,.04);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  button{font-family:inherit;color:inherit}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:radial-gradient(1100px 750px at 50% 28%,#f4f4f0,#dbdbd4);color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;min-height:100dvh}
  #device{position:relative;width:min(600px,97vw);height:min(96dvh,880px);background:#17171a;border-radius:48px;padding:30px;box-shadow:0 40px 90px rgba(15,15,20,.45),0 4px 18px rgba(15,15,20,.35),inset 0 0 0 2px #2e2e33;flex:none}
  #device::before{content:"";position:absolute;top:12px;left:50%;transform:translateX(-50%);width:9px;height:9px;border-radius:50%;background:#3d3d44;box-shadow:inset 0 0 3px #000,0 0 0 2px #101013;z-index:2}
  .sidebtn{position:absolute;background:#2e2e33;border-radius:3px;z-index:1}
  .sidebtn.s1{right:-3.5px;top:140px;width:4px;height:72px}
  .sidebtn.s2{left:-3.5px;top:120px;width:4px;height:50px}
  .sidebtn.s3{left:-3.5px;top:182px;width:4px;height:50px}
  #phone{position:relative;width:100%;height:100%;background:var(--bg);border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
  #phone::-webkit-scrollbar{display:none}
  #homebar{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:150px;height:5px;border-radius:99px;background:rgba(20,20,20,.32);z-index:60;pointer-events:none}
  @media (max-width:640px){ #device{padding:16px;border-radius:34px} #device::before{top:6px;width:7px;height:7px} #phone{border-radius:18px} }
  header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px}
  header .back{border:0;background:var(--field);color:var(--ink);font-size:20px;width:36px;height:36px;border-radius:50%;cursor:pointer;flex:none;line-height:1}
  header .back:disabled{opacity:.25}
  header .back:active{background:#e4e4de}
  header h1{font-size:16px;font-weight:700;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
  header .role{font-size:11px;font-weight:600;background:var(--field);color:var(--sub);padding:5px 10px;border-radius:999px;flex:none}
  main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:18px 16px 24px;scrollbar-width:none}
  main::-webkit-scrollbar{display:none}
  @keyframes screenIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  main.anim{animation:screenIn .22s ease both}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:12px;box-shadow:var(--shadow)}
  .card h2{font-size:15px;font-weight:700;margin:0 0 8px;letter-spacing:.01em}
  .muted{color:var(--sub);font-size:12.5px;line-height:1.55}
  .btn{display:block;width:100%;border:0;border-radius:999px;padding:15px;font-size:15px;font-weight:700;cursor:pointer;background:var(--ink);color:#fff;margin:8px 0;transition:transform .06s ease,opacity .15s}
  .btn:active{transform:scale(.985);opacity:.88}
  .btn.sub{background:var(--field);color:var(--ink)}
  .btn.blue{background:var(--blue)} .btn.warn{background:var(--warn)} .btn.bad{background:var(--bad)}
  .btn:disabled{opacity:.4}
  .item{display:flex;align-items:center;gap:10px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px 16px;margin-bottom:10px;cursor:pointer;width:100%;text-align:left;font-size:14.5px;box-shadow:var(--shadow);transition:transform .06s ease}
  .item:active{transform:scale(.99)}
  .item .grow{flex:1;line-height:1.45}
  .item .chev{color:var(--faint);font-size:19px;font-weight:300}
  .tag{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:#1e7a32;margin:3px 4px 0 0}
  .tag.orange{background:#fdf1de;color:#9a6206}.tag.red{background:#fdeceb;color:#b42318}.tag.blue{background:#e5effc;color:#175cd3}
  input,select,textarea{width:100%;font-size:15px;padding:13px 14px;border:1.5px solid transparent;border-radius:14px;margin:6px 0 12px;background:var(--field);font-family:inherit;color:var(--ink);outline:none}
  input:focus,select:focus,textarea:focus{background:#fff;border-color:var(--ink)}
  label{font-size:13px;font-weight:700}
  .choices button{display:block;width:100%;text-align:left;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px 15px;margin:8px 0;font-size:15px;cursor:pointer;transition:border-color .12s,background .12s}
  .choices button.sel{border-color:var(--ink);background:#f4f4f1;font-weight:700}
  .bar{height:8px;background:#eeeEe8;background:#eeeee8;border-radius:999px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
  .rowline{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;margin:7px 0}
  nav.tabs{flex:none;width:100%;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:none;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
  nav.tabs.show{display:flex}
  nav.tabs button{flex:1;border:0;background:none;padding:7px 2px 10px;font-size:10.5px;color:var(--faint);cursor:pointer;font-weight:600}
  nav.tabs button.on{color:var(--ink)}
  nav.tabs button .ic{display:block;font-size:21px;margin-bottom:1px;filter:grayscale(1);opacity:.55}
  nav.tabs button.on .ic{filter:none;opacity:1}
  .modal{position:absolute;inset:0;background:rgba(25,25,20,.44);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .modal.show{display:flex}
  .modal .sheet{background:#fff;width:100%;max-width:100%;border-radius:26px 26px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom));max-height:84dvh;overflow:auto;animation:sheetIn .24s cubic-bezier(.2,.9,.3,1) both}
  @keyframes sheetIn{from{transform:translateY(36px);opacity:.4}to{transform:none;opacity:1}}
  .modal .sheet h3{margin:2px 0 10px;font-size:16px}
  .done-ic{font-size:34px;width:76px;height:76px;margin:22px auto 10px;background:var(--accent-soft);border-radius:50%;display:flex;align-items:center;justify-content:center}
  .center{text-align:center}
  .qr{width:172px;height:172px;margin:12px auto;background:conic-gradient(#222 25%,#fff 0 50%,#222 0 75%,#fff 0) 0 0/34px 34px,#fff;border:10px solid #fff;outline:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}

<script>
"use strict";
/* ============ 画面遷移の仕組み（DBなし・遷移だけ） ============ */
function addStu(){ openModal('<h3>所属生徒追加の確認</h3><p class="muted">この生徒を 5年2組 に追加しますか？</p><button class="btn" onclick="closeModal();go(\'t_classdetail\')">追加する</button><button class="btn sub" onclick="closeModal()">やめる</button>'); }
const MEMO_W = 1200, MEMO_H = 1600;
const memoTool = { color:"#1a1a18", type:"pen", width:3 };
let memoDirty = false;
function memoSyncTools(){
  if(!document.querySelectorAll) return;
  document.querySelectorAll(".sw").forEach(b=>b.classList.toggle("sel", b.dataset.color === memoTool.color && memoTool.type !== "eraser"));
  document.querySelectorAll("[data-type]").forEach(b=>b.classList.toggle("sel", b.dataset.type === memoTool.type));
  document.querySelectorAll("[data-width]").forEach(b=>b.classList.toggle("sel", parseFloat(b.dataset.width) === memoTool.width));
}
function memoSetColor(c){ memoTool.color = c; if(memoTool.type === "eraser" || memoTool.type === "pan") memoTool.type = "pen"; memoSyncTools(); }
function memoSetType(tp){ memoTool.type = tp; memoSyncTools(); }
function memoSetWidth(w){ memoTool.width = w; memoSyncTools(); }
function memoSaveCurrent(){
  const cv = document.getElementById("memoCanvas");
  if(cv && memoDirty){ try{ S.memoPages[S.memoPage] = cv.toDataURL("image/png"); }catch(_){} }
}
function memoGoPage(i){ memoSaveCurrent(); S.memoPage = i; render(); }
function memoAddPage(){ memoSaveCurrent(); S.memoPages.push(null); S.memoPage = S.memoPages.length - 1; render(); }
function memoDelPage(){ S.memoPages.splice(S.memoPage,1); if(!S.memoPages.length) S.memoPages = [null]; S.memoPage = Math.max(0, S.memoPage - 1); render(); }
function memoClear(){ S.memoPages[S.memoPage] = null; render(); }
function memoSaveImage(){
  memoSaveCurrent();
  const url = S.memoPages[S.memoPage];
  if(!url){ openModal('<h3>まだ何も描かれていません</h3><p class=muted>描いてから保存してください．</p><button class="btn sub" onclick="closeModal()">閉じる</button>'); return; }
  const a = document.createElement("a");
  a.href = url; a.download = "考え方メモ_" + String(S.unit || "単元").replace(/[\\/:*?"<>|]/g, "_") + "_ページ" + (S.memoPage + 1) + ".png";
  document.body.appendChild(a); a.click(); a.remove();
}
function memoPageBar(){
  let h = '<div class="trow"><span class="tlabel">ページ</span>';
  S.memoPages.forEach((_, i)=>{ h += '<button class="tbtn' + (i === S.memoPage ? ' sel' : '') + '" onclick="memoGoPage(' + i + ')">' + (i + 1) + '</button>'; });
  h += '<button class="tbtn" onclick="memoAddPage()">＋ 追加</button>';
  if(S.memoPages.length > 1) h += '<button class="tbtn" onclick="memoDelPage()">このページを削除</button>';
  return h + '</div>';
}
function memoPostImgs(){
  const ps = S.memoPages || [];
  if(!ps.some(Boolean)) return '<p class="muted">手書きメモは添付されていません．問題解答の画面で描いたメモが，ここに付きます．</p>';
  return ps.map((pg, i)=> pg ? '<p class="muted" style="margin:6px 0 2px">手書きメモ（ページ' + (i + 1) + '）</p><img class="memoimg" src="' + pg + '" alt="手書きメモ">' : "").join("");
}
function initMemo(){
  const cv = document.getElementById("memoCanvas");
  if(!cv || !cv.getContext) return;
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(MEMO_W * dpr); cv.height = Math.round(MEMO_H * dpr);
  cv.style.width = MEMO_W + "px"; cv.style.height = MEMO_H + "px";
  const ctx = cv.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, MEMO_W, MEMO_H);
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  memoDirty = false;
  const saved = S.memoPages[S.memoPage];
  if(saved){ const img = new Image(); img.onload = ()=>{ ctx.drawImage(img, 0, 0, MEMO_W, MEMO_H); }; img.src = saved; memoDirty = true; }
  memoSyncTools();
  let drawing = false, last = null, panStart = null;
  const pos = (e)=>{ const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  cv.addEventListener("pointerdown", (e)=>{
    e.preventDefault();
    try{ cv.setPointerCapture(e.pointerId); }catch(_){}
    if(memoTool.type === "pan"){ const w = cv.parentElement; panStart = { x: e.clientX, y: e.clientY, sl: w.scrollLeft, st: w.scrollTop }; return; }
    drawing = true; memoDirty = true; last = pos(e);
    if(memoTool.type === "eraser"){ ctx.strokeStyle = "#ffffff"; ctx.globalAlpha = 1; ctx.lineWidth = memoTool.width * 3; }
    else if(memoTool.type === "marker"){ ctx.strokeStyle = memoTool.color; ctx.globalAlpha = 0.35; ctx.lineWidth = memoTool.width * 2.4; }
    else { ctx.strokeStyle = memoTool.color; ctx.globalAlpha = 1; ctx.lineWidth = memoTool.width; }
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(last.x + 0.1, last.y + 0.1); ctx.stroke();
  });
  cv.addEventListener("pointermove", (e)=>{
    if(panStart){ const w = cv.parentElement; w.scrollLeft = panStart.sl - (e.clientX - panStart.x); w.scrollTop = panStart.st - (e.clientY - panStart.y); return; }
    if(!drawing) return;
    const pt = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(pt.x, pt.y); ctx.stroke(); last = pt;
  });
  const end = ()=>{ if(panStart){ panStart = null; return; } if(!drawing) return; drawing = false; ctx.globalAlpha = 1; memoSaveCurrent(); };
  cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);
}
const SCREENS = {};              // id -> {title, role, tab, html}
let stack = [];
let cur = null;
let roleName = "";
const S = { child:"たろう", unit:"分数のたし算", quizAns:null, knowSel:null, consent:true, timeLimit:"60分", suspended:false, memoPages:[null], memoPage:0 };

function def(id, title, role, html, tab){ SCREENS[id] = {title, role, html, tab}; }
function go(id){
  if(!SCREENS[id]){ alert("未実装の画面です: "+id); return; }
  stack.push(id); render();
}
function back(){
  if(stack.length > 1){ stack.pop(); render(); }
}
function jump(id){ stack = [id]; render(); }           // 履歴をリセットして移動（ログイン等）
function homeOf(role){
  return {student:"s_home", parent:"p_home", teacher:"t_home", admin:"a_menu"}[role] || "start";
}
function render(){
  cur = stack[stack.length-1];
  const sc = SCREENS[cur];
  document.getElementById("hdrTitle").textContent = sc.title;
  document.getElementById("hdrRole").textContent = sc.role || "";
  document.getElementById("backBtn").disabled = stack.length <= 1;
  const app = document.getElementById("app");
  app.innerHTML = typeof sc.html === "function" ? sc.html() : sc.html;
  app.classList.remove("anim"); void app.offsetWidth; app.classList.add("anim");
  initMemo();
  window.scrollTo(0,0); if(app && app.scrollTo) app.scrollTo(0,0);
  // 生徒タブバー
  const tb = document.getElementById("tabbar");
  if(sc.tab){
    tb.className = "tabs show";
    tb.innerHTML = [["s_home","🏠","ホーム"],["s_solve","✏️","解く"],["s_quiz","💬","みんなどう？"],["s_know","💡","知ってる？"],["s_settings","⚙️","設定"]]
      .map(([id,ic,lb])=>`<button class="${sc.tab===id?'on':''}" onclick="jump('${id}')"><span class="ic">${ic}</span>${lb}</button>`).join("");
    document.querySelector("main").style.paddingBottom = "90px";
  } else {
    tb.className = "tabs"; tb.innerHTML = "";
    document.querySelector("main").style.paddingBottom = "20px";
  }
  if(sc.onshow) sc.onshow();
}
function openModal(html){ document.getElementById("modalSheet").innerHTML = html; document.getElementById("modal").classList.add("show"); }
function closeModal(){ document.getElementById("modal").classList.remove("show"); }
function item(go_id, title, sub, tags){
  return `<button class="item" onclick="go('${go_id}')"><span class="grow"><b>${title}</b>${sub?`<br><span class="muted">${sub}</span>`:""}${tags?`<br>${tags}`:""}</span><span class="chev">›</span></button>`;
}
function doneScr(emoji, title, msg, btnLabel, go_id){
  return `<div class="done-ic">${emoji}</div><h2 class="center">${title}</h2><p class="center muted">${msg}</p>
          <button class="btn" onclick="go('${go_id}')">${btnLabel}</button>`;
}

def("login","ログイン","",()=>`
  <div class="card"><h2>${roleName} ログイン</h2>
    <label>メールアドレス</label><input type="email" placeholder="example@mail.jp" value="demo@manabico.jp">
    <label>パスワード</label><input type="password" value="demo1234">
    <button class="btn" onclick="doLogin()">ログイン</button>
    <button class="btn sub" onclick="go('pw')">パスワードを忘れた方</button>
  </div>
  <div class="card"><h2>はじめての方</h2>
    <button class="btn sub" onclick="go(regOf())">新規会員登録はこちら</button>
    <button class="btn sub" onclick="jump('start')">立場の選択に戻る</button>
  </div>
`);
function regOf(){ return {"生徒":"s_reg","保護者":"p_reg","先生":"t_reg","管理者":"a_menu"}[roleName] || "s_reg"; }
function doLogin(){
  const dest = {"生徒":"s_home","保護者":"p_home","先生":"t_home","管理者":"a_menu"}[roleName] || "s_home";
  jump(dest);
}
def("pw","パスワード再設定","",`
  <div class="card"><h2>パスワードの再設定</h2>
    <p class="muted">登録したメールアドレスに，再設定用の案内を送ります．</p>
    <label>メールアドレス</label><input type="email" placeholder="example@mail.jp">
    <button class="btn" onclick="openModal('<h3>送信しました</h3><p class=muted>メールに届いた案内から，新しいパスワードを設定してください．</p><button class=btn onclick=\\'closeModal();back()\\'>ログインへ戻る</button>')">再設定メールを送る</button>
    <button class="btn sub" onclick="back()">もどる</button>
  </div>
`);

def("logout","ログアウト","",`
  <div class="done-ic">👋</div><h2 class="center">ログアウトしました</h2>
  <button class="btn" onclick="jump('start')">スタートへ</button>
`);
def("s_reg","新規会員登録","生徒",`
  <div class="card"><h2>生徒の新規登録</h2>
    <p class="muted">仮登録 → 保護者の同意 → 本登録，の順に進みます．</p>
    <label>ニックネーム</label><input value="まなぶ">
    <label>学校コード</label><input value="KUT-2026">
    <label>パスワード</label><input type="password" value="demo1234">
    <div class="switchrow"><span style="font-size:13px">利用規約に同意する</span><input type="checkbox" checked style="width:22px;height:22px"></div>
    <button class="btn" onclick="openModal('<h3>仮登録ができました</h3><p class=muted>保護者の方の同意があると，本登録になります．同意の依頼は学校経由で届きます．</p><button class=btn data-to=login onclick=\\'closeModal();jump(this.dataset.to)\\'>ログイン画面へ</button>')">仮登録する</button>
    <button class="btn sub" onclick="back()">もどる</button>
  </div>
`);
def("s_home","ホーム","生徒",()=>`

    <div class="stat"><b>12問</b><span>今週解いた問題</span></div>
    <div class="stat"><b>3件</b><span>今週の振り返り</span></div>
  </div>
  <div class="card"><h2>📚 今日の宿題</h2>
    <p><b>分数のたし算</b>（算数）<br><span class="muted">しめきり：今日まで</span></p>
    <div class="rowline"><span>進み具合</span><b>あと3問</b></div>
    <div class="bar"><i style="width:62%"></i></div>
